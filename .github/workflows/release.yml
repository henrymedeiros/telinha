# Builds the desktop app for Linux and Windows and publishes it on the Releases page.
#
# To release: set the version in native/Cargo.toml, run any cargo command so
# Cargo.lock follows, commit both, then
#   git tag vX.Y.Z && git push origin vX.Y.Z
# The tag has to be "v" plus that version, or the run stops before building.
#
# These packages are public: no server is baked in, so on first run the app asks
# for an invite link. Running it by hand (Actions tab) only keeps the packages as
# a download on that run.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Only the publish job may write to the repository.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # The packages are named after native/Cargo.toml and the release after
      # the tag: a tag that says another version would publish mislabeled files.
      - name: Tag matches the version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "::error::tag $GITHUB_REF_NAME does not match version $version in native/Cargo.toml"; exit 1; }

      # The Windows FFmpeg build uses a ~10 GB Docker image.
      - name: Free disk space
        working-directory: /
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y ninja-build clang llvm libclang-dev libdrm-dev libpipewire-0.3-0t64 python3-venv zip

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-deb@3.8.0,cargo-zigbuild@0.23.4,cargo-xwin@0.23.1

      - id: deps
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: native/.deps
          key: deps-${{ hashFiles('native/scripts/fetch-deps.sh', 'native/scripts/ffmpeg-nvenc.sh') }}

      - name: Dependencies (FFmpeg, libva, Zig, packaging tools)
        run: sh scripts/fetch-deps.sh && rm -rf .deps/FFmpeg-Builds .deps/debs

      # Saved right away: the Windows FFmpeg takes ~20 minutes and must not be
      # rebuilt just because a later step failed.
      - if: steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: native/.deps
          key: ${{ steps.deps.outputs.cache-primary-key }}

      # A release never goes out with a failing test. The debug build is removed
      # afterwards: the packaging below needs the disk.
      - name: Tests
        run: LD_LIBRARY_PATH=$PWD/.deps/libva/lib:$PWD/.deps/ffmpeg-linux/lib CARGO_PROFILE_DEV_DEBUG=0 cargo test --locked && rm -rf target/debug

      - name: Packages
        run: sh scripts/package.sh tudo
        env:
          TELINHA_SERVER: ""

      # The publish job takes them from here; on a manual run they stay as a download.
      - name: Keep the packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: telinha
          if-no-files-found: error
          path: |
            native/dist/*.AppImage
            native/dist/*.deb
            native/dist/*.exe
            native/dist/*.zip

  # Runs nothing from the repository or from the build: it only uploads what the
  # build job produced, so the token that can write is never near third-party code.
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: telinha
          path: dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.AppImage dist/*.deb dist/*-instalador.exe dist/*-portatil.zip --generate-notes
